<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 440" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>POP 链流程：GIT 到 ZeroZone 到 eval</title>
<desc>反序列化对象销毁后，GIT __destruct echo password 触发 ZeroZone __toString 进而 eval 执行代码</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-family="sans-serif" font-size="15" font-weight="500" fill="#1f2937">POP 链：从反序列化对象到代码执行</text>
<text x="40" y="56" font-family="sans-serif" font-size="13" fill="#6b7280">靠属性类型把两个类「串」起来，借魔法方法的自动触发抵达 eval。</text>

<rect x="130" y="70" width="420" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C">构造 GIT 对象</text>
<text x="340" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">username = 'ZeroZone'</text>
<text x="340" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">password = 一个 ZeroZone 对象</text>

<line x1="340" y1="132" x2="340" y2="152" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="130" y="154" width="420" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#3C3489">脚本结束 → GIT::__destruct() 自动触发</text>
<text x="340" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">对象销毁时 PHP 自己调用</text>

<line x1="340" y1="206" x2="340" y2="226" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="130" y="228" width="420" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#3C3489">username == 'ZeroZone' 成立</text>
<text x="340" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">→ echo $this-&gt;password</text>

<line x1="340" y1="280" x2="340" y2="300" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="130" y="302" width="420" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#633806">$password 是对象，被 echo</text>
<text x="340" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">→ 触发 ZeroZone::__toString()</text>

<line x1="340" y1="354" x2="340" y2="374" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="130" y="376" width="420" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="396" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#27500A">__toString 内 eval($code)</text>
<text x="340" y="414" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500A">→ system('cat /f*') 读出 /flag</text>
</svg>
