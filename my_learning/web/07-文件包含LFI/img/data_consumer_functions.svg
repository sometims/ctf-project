<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 360" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>data:// 与消费函数的关系</title>
<desc>data:// 只是数据源，只有 include/require 这类会执行包含内容的函数才让其中的 PHP 代码运行，file_get_contents 等只读不改不执行</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-family="sans-serif" font-size="15" font-weight="500" fill="#1f2937">data:// 只是数据源 · 执不执行看「哪个函数消费它」</text>
<text x="40" y="56" font-family="sans-serif" font-size="13" fill="#6b7280">同一个 data:// 串，喂给不同函数，结果完全不同。</text>

<rect x="220" y="74" width="240" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">data:// 数据体（含 PHP 代码）</text>

<line x1="280" y1="122" x2="180" y2="148" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="122" x2="500" y2="148" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="156" width="240" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="160" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#3C3489">include / require</text>
<text x="160" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">会解析执行包含的内容</text>

<rect x="400" y="156" width="240" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="520" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#633806">file_get_contents / readfile</text>
<text x="520" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#633806">只把内容当文本读出来</text>

<line x1="160" y1="208" x2="160" y2="238" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="208" x2="520" y2="238" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="246" width="240" height="54" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="160" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#27500A">✓ 代码被执行</text>
<text x="160" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#27500A">结果被回显到页面</text>

<rect x="400" y="246" width="240" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="520" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#444441">✗ 代码不运行</text>
<text x="520" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">原样当成字符串返回</text>
</svg>
