<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 510" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>data:// 伪协议拆解与 include 处理流程</title>
<desc>展示 file 参数收到的 data:// 字符串如何被 PHP 识别，并把逗号后的数据体当 PHP 代码执行</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="38" font-family="sans-serif" font-size="15" font-weight="500" fill="#1f2937">data:// 是什么 · 传给 file 的到底是什么</text>
<text x="40" y="60" font-family="sans-serif" font-size="13" fill="#6b7280">它是一段特殊的「地址字符串」，不是文件路径。冒号后面的逗号之后，才是真正被当作文件内容的数据。</text>

<text x="40" y="96" font-family="sans-serif" font-size="13" font-weight="500" fill="#1f2937">GET 参数 file 收到的完整值（本题示例）：</text>

<rect x="40" y="108" width="92" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="86" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">data:</text>

<rect x="132" y="108" width="132" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="198" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#27500A">text/plain</text>

<rect x="264" y="108" width="26" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="277" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">,</text>

<rect x="290" y="108" width="350" height="48" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="465" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#72243E">&lt;?php $a='fl'.'ag'; echo file_get_contents('/'.$a); ?&gt;</text>

<text x="86" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">① 协议头</text>
<text x="198" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">② 媒体类型</text>
<text x="277" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">③ 分隔符</text>
<text x="465" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">④ 数据体 = 要执行的 PHP 代码</text>

<text x="40" y="216" font-family="sans-serif" font-size="13" font-weight="500" fill="#1f2937">服务器拿到这个字符串后做了什么？</text>

<rect x="150" y="228" width="380" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">① PHP 读到 file 值，发现开头是 data:</text>
<text x="340" y="264" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">→ 认出这是 data:// 伪协议，不是文件路径</text>

<line x1="340" y1="280" x2="340" y2="296" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="298" width="380" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">② include 不去磁盘找文件，</text>
<text x="340" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">而是把逗号后面的「数据体」当作文件内容读入</text>

<line x1="340" y1="350" x2="340" y2="366" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="368" width="380" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500A">③ 数据体里写的是 PHP 代码，</text>
<text x="340" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#27500A">PHP 引擎照样执行其中的指令</text>

<line x1="340" y1="420" x2="340" y2="436" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="438" width="380" height="52" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="340" y="456" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#72243E">④ 代码结果（如读出的 /flag）</text>
<text x="340" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#72243E">被回显到网页上</text>
</svg>
